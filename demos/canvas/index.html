<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockly Canvas 演示</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #blocklyDiv {
      height: 400px;
      width: 100%;
      border: 1px solid #ccc;
    }
    #canvas-container {
      height: 300px;
      width: 400px;
      margin-top: 20px;
    }
    #runButton {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      width: 100px;
    }
    #runButton:hover {
      background-color: #45a049;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
  </style>
  <script type="module">
    import {inject, JavaScript} from '../../build/blockly.loader.mjs';
    import '../../build/blocks.loader.mjs';
    import '../../build/javascript.loader.mjs';
    import '../../build/msg/zh-hans.js';

    // 初始化Blockly
    const workspace = inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      grid: {enabled: true}
    });

    // 运行按钮事件
    document.getElementById('runButton').addEventListener('click', function() {
      const code = JavaScript.workspaceToCode(workspace);
      try {
        eval(code);
      } catch (error) {
        console.error('代码执行错误:', error);
        alert('代码执行错误: ' + error.message);
      }
    });
  </script>
</head>
<body>
  <h1>Blockly Canvas 绘制演示</h1>
  <div class="controls">
    <button id="runButton">运行代码</button>
  </div>
  <div id="blocklyDiv"></div>
  <div id="canvas-container"></div>

  <xml id="toolbox" style="display: none;">
    <category name="Canvas" colour="#5C81A6">
      <block type="canvas_create"></block>
      <block type="canvas_draw_line"></block>
      <block type="canvas_draw_rect"></block>
      <block type="canvas_draw_circle"></block>
      <block type="canvas_draw_text"></block>
      <sep></sep>
      <block type="canvas_set_fill_color"></block>
      <block type="canvas_set_stroke_color"></block>
      <sep></sep>
      <block type="canvas_set_line_width"></block>
      <block type="canvas_set_line_style"></block>
      <block type="canvas_set_font_size"></block>
      <sep></sep>
      <block type="canvas_move_to"></block>
      <block type="canvas_line_to"></block>
      <block type="canvas_rotate"></block>
      <sep></sep>
      <block type="canvas_clear"></block>
      <block type="canvas_save"></block>
      <block type="canvas_restore"></block>
      <sep></sep>
      <block type="canvas_load_image"></block>
      <block type="canvas_draw_image"></block>
      <sep></sep>
      <block type="canvas_animation"></block>
    </category>
    <category name="数学" colour="#5C81A6">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
    </category>
    <category name="文本" colour="#5C81A6">
      <block type="text"></block>
    </category>
  </xml>

  <script>
    // 初始化Blockly
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true,
      grid: {enabled: true}
    });

    // 运行按钮事件
    document.getElementById('runButton').addEventListener('click', function() {
      const code = Blockly.JavaScript.workspaceToCode(workspace);
      try {
        eval(code);
      } catch (error) {
        console.error('代码执行错误:', error);
        alert('代码执行错误: ' + error.message);
      }
    });
  </script>
</body>
</html>
