<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockly Canvas 测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #blocklyDiv {
      height: 400px;
      width: 800px;
      border: 1px solid #ccc;
    }
    #canvas-container {
      height: 300px;
      width: 400px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Blockly Canvas 测试</h1>
  <button id="runBtn">运行代码</button>
  <div id="blocklyDiv"></div>
  <div id="canvas-container"></div>

  <xml id="toolbox" style="display: none;">
    <category name="Canvas" colour="#5C81A6">
      <block type="canvas_create"></block>
      <block type="canvas_draw_rect"></block>
      <block type="canvas_set_stroke_color"></block>
      <block type="canvas_set_line_width"></block>
    </category>
    <category name="数学" colour="#5C81A6">
      <block type="math_number"></block>
    </category>
  </xml>

  <script type="module">
    // 从src目录导入模块
    import * as Blockly from './src/core/blockly.js';
    import './src/blocks/blocks.js';
    import * as JavaScript from './src/generators/javascript.js';
    import './src/msg/messages.js';

    // 初始化Blockly工作区
    const workspace = Blockly.inject('blocklyDiv', {
      toolbox: document.getElementById('toolbox'),
      trashcan: true
    });

    // 运行按钮事件
    document.getElementById('runBtn').addEventListener('click', () => {
      const code = JavaScript.javascriptGenerator.workspaceToCode(workspace);
      console.log('生成的代码:', code);
      try {
        eval(code);
      } catch (error) {
        console.error('执行错误:', error);
        alert('错误: ' + error.message);
      }
    });
  </script>
</body>
</html>
